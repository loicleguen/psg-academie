server {
    listen 80;
    server_name localhost;

    # Resolver DNS interne Docker pour re-résoudre les IPs dynamiquement
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend (React app avec Hot Reload via Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Catapult (données physiques)
    # API Catapult - fichiers statiques (photos) : chemin complet sans strip
    location /api/physical/static/ {
        set $catapult backend-catapult;
        proxy_pass http://$catapult:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/physical/ {
        set $catapult backend-catapult;
        rewrite ^/api/physical/(.*) /$1 break;
        proxy_pass http://$catapult:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API Veo (données tactiques)
    location /api/tactical/ {
        set $veo backend-veo;
        rewrite ^/api/tactical/(.*) /$1 break;
        proxy_pass http://$veo:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
