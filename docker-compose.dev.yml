# Configuration de développement avec hot reload
services:
  # Frontend en mode développement avec Vite dev server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: psg_frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    restart: unless-stopped

  # Nginx adapté pour le mode dev
  nginx:
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
