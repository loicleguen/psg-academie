services:
  # Base de données PostgreSQL pour Catapult (données physiques)
  db-catapult:
    image: postgres:16
    container_name: psg_db_catapult
    restart: always
    environment:
      POSTGRES_USER: psguser
      POSTGRES_PASSWORD: psgpass
      POSTGRES_DB: psgdb
    volumes:
      - postgres_catapult_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psguser -d psgdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de données PostgreSQL pour Veo (données tactiques)
  db-veo:
    image: postgres:16
    container_name: psg_db_veo
    restart: always
    environment:
      POSTGRES_DB: veo_db
      POSTGRES_USER: veo_user
      POSTGRES_PASSWORD: veo_password
    volumes:
      - postgres_veo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veo_user -d veo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Catapult (données physiques: GPS, distance, vitesse...)
  backend-catapult:
    build: ./backend-catapult
    container_name: psg_backend_catapult
    restart: always
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./backend-catapult:/app
    depends_on:
      db-catapult:
        condition: service_healthy
    environment:
      - SECRET_KEY=6393013afbfb365ab854ba0f1c6e9aee551ef777a273253fdf18cb219070076ace66e1108f5c551faaef05a3bb06f73fbc9e52ca53bec16ab8f9c77846078b22
      - ENV=prod
      - DATABASE_URL=postgresql://psguser:psgpass@db-catapult:5432/psgdb
    ports:
      - "8000:8000"

  # Backend Veo (données tactiques: buts, passes, stats...)
  backend-veo:
    build:
      context: ./backend-veo
      dockerfile: Dockerfile
    container_name: psg_backend_veo
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://veo_user:veo_password@db-veo:5432/veo_db
      API_HOST: 0.0.0.0
      API_PORT: 8001
      CORS_ORIGINS: http://localhost
    depends_on:
      db-veo:
        condition: service_healthy
    volumes:
      - ./backend-veo/app:/app/app
      - ./backend-veo/alembic:/app/alembic
      - ./backend-veo/alembic.ini:/app/alembic.ini
    command: >
      sh -c "
        echo 'Waiting for Veo database...' &&
        sleep 5 &&
        alembic upgrade head &&
        python -m app.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      "
    ports:
      - "8001:8001"

  # Frontend React + Vite avec Hot Reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: psg_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Nginx reverse proxy
  nginx:
    image: nginx:latest
    container_name: psg_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend-catapult
      - backend-veo
      - frontend

volumes:
  postgres_catapult_data:
  postgres_veo_data:
