services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: psguser
      POSTGRES_PASSWORD: psgpass
      POSTGRES_DB: psgdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - ENV=prod
      - DATABASE_URL=postgresql://psguser:psgpass@db:5432/psgdb
    
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend

volumes:
  postgres_data:
